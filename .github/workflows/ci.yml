name: CI

on:
    push:
    pull_request:

permissions:
    contents: read

jobs:
    quality:
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                node-version: ["22.13.0", 24]

        steps:
            - name: Checkout
              uses: actions/checkout@v6

            - name: Setup Node.js
              uses: actions/setup-node@v6
              with:
                  node-version: ${{ matrix.node-version }}
                  cache: npm

            - name: Install dependencies
              run: npm ci

            - name: Run package, template, and smoke checks
              run: npm run check

    docker-smoke:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout
              uses: actions/checkout@v6

            - name: Setup Node.js
              uses: actions/setup-node@v6
              with:
                  node-version: 24
                  cache: npm

            - name: Install dependencies
              run: npm ci

            - name: Run Docker smoke check
              run: npm run test:docker
