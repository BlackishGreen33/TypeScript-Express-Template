version: 2

updates:
    - package-ecosystem: npm
      directory: /
      schedule:
          interval: weekly
      open-pull-requests-limit: 5
      groups:
          root-dependencies:
              patterns: ["*"]

    - package-ecosystem: npm
      directory: /template
      schedule:
          interval: weekly
      open-pull-requests-limit: 5
      groups:
          template-dependencies:
              patterns: ["*"]

    - package-ecosystem: github-actions
      directory: /
      schedule:
          interval: weekly
      open-pull-requests-limit: 5
      groups:
          github-actions:
              patterns: ["*"]
