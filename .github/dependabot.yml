version: 2

updates:
    - package-ecosystem: npm
      directory: /
      schedule:
          interval: weekly
      open-pull-requests-limit: 5
      allow:
          - dependency-name: "*"
            update-types:
                - version-update:semver-minor
                - version-update:semver-patch
      groups:
          root-dependencies:
              patterns: ["*"]
              update-types: [minor, patch]

    - package-ecosystem: npm
      directory: /template
      schedule:
          interval: weekly
      open-pull-requests-limit: 5
      allow:
          - dependency-name: "*"
            update-types:
                - version-update:semver-minor
                - version-update:semver-patch
      groups:
          template-dependencies:
              patterns: ["*"]
              update-types: [minor, patch]

    - package-ecosystem: github-actions
      directory: /
      schedule:
          interval: weekly
      open-pull-requests-limit: 5
      groups:
          github-actions:
              patterns: ["*"]
